name: menuassistai-powereddietaryintelligenceapp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Matches *_DATABASE_URL credentials in root .env (postgres:root)
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Host 6380 — 6379 is often taken by another local Redis
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-4000}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      APPLICATION_SERVICE_URL: http://application-service:${APPLICATION_SERVICE_PORT:-4002}
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT:-4003}
      AI_INGESTION_SERVICE_URL: http://ai-ingestion-service:${AI_INGESTION_SERVICE_PORT:-4004}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '${API_GATEWAY_PORT:-4000}:${API_GATEWAY_PORT:-4000}'
    depends_on:
      - auth-service
      - application-service
      - admin-service
      - ai-ingestion-service
      - rabbitmq

  ai-ingestion-service:
    build:
      context: .
      dockerfile: apps/ai-ingestion-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_INGESTION_SERVICE_PORT: ${AI_INGESTION_SERVICE_PORT:-4004}
      AI_INGESTION_DATABASE_URL: postgresql://postgres:root@postgres:5432/menu_assist_ai_ingestion_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_JWKS_URI: http://auth-service:${AUTH_SERVICE_PORT:-4001}/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      AUTH_JWT_AUDIENCE: menu-assist-api
      APPLICATION_SERVICE_URL: http://application-service:${APPLICATION_SERVICE_PORT:-4002}
      APPLICATION_INTERNAL_API_KEY: ${APPLICATION_INTERNAL_API_KEY:-dev-internal-application-key}
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT:-4003}
      ADMIN_INTERNAL_API_KEY: ${ADMIN_INTERNAL_API_KEY:-dev-internal-onboarding-key}
      API_GATEWAY_PUBLIC_URL: http://localhost:${API_GATEWAY_PORT:-4000}
      INGESTION_INTERNAL_API_KEY: ${INGESTION_INTERNAL_API_KEY:-dev-internal-ingestion-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1024}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_IMAGE_TIMEOUT_MS: ${OPENAI_IMAGE_TIMEOUT_MS:-120000}
      DISH_IMAGE_FALLBACK_CACHE_HOURS: ${DISH_IMAGE_FALLBACK_CACHE_HOURS:-24}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-AIzaSyCp-ko0UWWEGvVwiS4-3BjgXJYDoJMwfa8}
      OCR_PROVIDER: ${OCR_PROVIDER:-google}
      SCAN_DISH_CONCURRENCY: ${SCAN_DISH_CONCURRENCY:-4}
      FILE_STORAGE_LOCAL_ROOT: ${FILE_STORAGE_LOCAL_ROOT:-uploads}
      APPLICATION_PUBLIC_URL: ${APPLICATION_PUBLIC_URL:-}
      FILE_STORAGE_PUBLIC_URL: ${FILE_STORAGE_PUBLIC_URL:-}
    ports:
      - '${AI_INGESTION_SERVICE_PORT:-4004}:${AI_INGESTION_SERVICE_PORT:-4004}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      application-service:
        condition: service_started
      admin-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    env_file:
      - .env
      - apps/auth-service/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-4001}
      AUTH_DATABASE_URL: postgresql://postgres:root@postgres:5432/menu_assist_auth_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      SIGNUP_OTP_RESEND_COOLDOWN_SECONDS: ${SIGNUP_OTP_RESEND_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_OTP_RESEND_COOLDOWN_SECONDS: ${PASSWORD_RESET_OTP_RESEND_COOLDOWN_SECONDS:-60}
      JWT_ISSUER: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      JWT_AUDIENCE: menu-assist-api
      JWT_KID: menu-assist-rs256
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:-dev-internal-auth-key}
      OIDC_REDIRECT_URI: http://localhost:${API_GATEWAY_PORT:-4000}/v1/auth/oauth/callback
      APPLICATION_SERVICE_URL: http://application-service:${APPLICATION_SERVICE_PORT:-4002}
      APPLICATION_INTERNAL_API_KEY: ${APPLICATION_INTERNAL_API_KEY:-dev-internal-application-key}
    ports:
      - '${AUTH_SERVICE_PORT:-4001}:${AUTH_SERVICE_PORT:-4001}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  application-service:
    build:
      context: .
      dockerfile: apps/application-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APPLICATION_SERVICE_PORT: ${APPLICATION_SERVICE_PORT:-4002}
      APPLICATION_DATABASE_URL: postgresql://postgres:root@postgres:5432/menu_assist_application_service
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT:-4003}
      ADMIN_INTERNAL_API_KEY: ${ADMIN_INTERNAL_API_KEY:-dev-internal-onboarding-key}
      APPLICATION_INTERNAL_API_KEY: ${APPLICATION_INTERNAL_API_KEY:-dev-internal-application-key}
      AI_INGESTION_SERVICE_URL: http://ai-ingestion-service:${AI_INGESTION_SERVICE_PORT:-4004}
      INGESTION_INTERNAL_API_KEY: ${INGESTION_INTERNAL_API_KEY:-dev-internal-ingestion-key}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      CONTACT_CHANGE_OTP_RESEND_COOLDOWN_SECONDS: ${CONTACT_CHANGE_OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:-dev-internal-auth-key}
      AUTH_JWKS_URI: http://auth-service:${AUTH_SERVICE_PORT:-4001}/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      AUTH_JWT_AUDIENCE: menu-assist-api
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-premium}
      REVENUECAT_MANAGEMENT_URL: ${REVENUECAT_MANAGEMENT_URL:-}
      MEMBERSHIP_PRICE_LABEL: ${MEMBERSHIP_PRICE_LABEL:-$$2.99}
      MEMBERSHIP_BILLING_PERIOD_LABEL: ${MEMBERSHIP_BILLING_PERIOD_LABEL:-Per Month}
      REFERRAL_SHARE_BASE_URL: ${REFERRAL_SHARE_BASE_URL:-https://menu-assist.anikstudio.com}
      APPLICATION_PUBLIC_URL: ${APPLICATION_PUBLIC_URL:-}
    ports:
      - '${APPLICATION_SERVICE_PORT:-4002}:${APPLICATION_SERVICE_PORT:-4002}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      admin-service:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_SERVICE_PORT: ${ADMIN_SERVICE_PORT:-4003}
      ADMIN_DATABASE_URL: postgresql://postgres:root@postgres:5432/menu_assist_admin_service
      ADMIN_INTERNAL_API_KEY: ${ADMIN_INTERNAL_API_KEY:-dev-internal-onboarding-key}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_JWKS_URI: http://auth-service:${AUTH_SERVICE_PORT:-4001}/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      AUTH_JWT_AUDIENCE: menu-assist-api
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-4001}
      AUTH_INTERNAL_API_KEY: ${AUTH_INTERNAL_API_KEY:-dev-internal-auth-key}
      APPLICATION_SERVICE_URL: http://application-service:${APPLICATION_SERVICE_PORT:-4002}
      APPLICATION_INTERNAL_API_KEY: ${APPLICATION_INTERNAL_API_KEY:-dev-internal-application-key}
      AI_INGESTION_SERVICE_URL: http://ai-ingestion-service:${AI_INGESTION_SERVICE_PORT:-4004}
      INGESTION_INTERNAL_API_KEY: ${INGESTION_INTERNAL_API_KEY:-dev-internal-ingestion-key}
      REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:-}
      REVENUECAT_PROJECT_ID: ${REVENUECAT_PROJECT_ID:-}
      REVENUECAT_API_BASE_URL: ${REVENUECAT_API_BASE_URL:-https://api.revenuecat.com/v2}
      FILE_STORAGE_LOCAL_ROOT: ${FILE_STORAGE_LOCAL_ROOT:-uploads}
      FILE_STORAGE_PUBLIC_URL: ${FILE_STORAGE_PUBLIC_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
    ports:
      - '${ADMIN_SERVICE_PORT:-4003}:${ADMIN_SERVICE_PORT:-4003}'
    volumes:
      - file_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

networks:
  default:
    name: menuassist_backend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  file_uploads:
