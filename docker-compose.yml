version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      API_GATEWAY_PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      APPLICATION_SERVICE_URL: http://application-service:5002
      ADMIN_SERVICE_URL: http://admin-service:5003
      AI_INGESTION_SERVICE_URL: http://ai-ingestion-service:5004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '5000:5000'
    depends_on:
      - auth-service
      - application-service
      - admin-service
      - ai-ingestion-service
      - rabbitmq

  ai-ingestion-service:
    build:
      context: .
      dockerfile: apps/ai-ingestion-service/Dockerfile
    environment:
      AI_INGESTION_SERVICE_PORT: 5004
      AI_INGESTION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/menu_assist_ai_ingestion_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_JWKS_URI: http://auth-service:5001/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:5001
      AUTH_JWT_AUDIENCE: menu-assist-api
      APPLICATION_SERVICE_URL: http://application-service:5002
      APPLICATION_INTERNAL_API_KEY: dev-internal-application-key
      ADMIN_SERVICE_URL: http://admin-service:5003
      ADMIN_INTERNAL_API_KEY: dev-internal-onboarding-key
      API_GATEWAY_PUBLIC_URL: http://localhost:5000
      INGESTION_INTERNAL_API_KEY: dev-internal-ingestion-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: gpt-4o-mini
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      OCR_PROVIDER: google
    ports:
      - '5004:5004'
    depends_on:
      - rabbitmq
      - application-service
      - admin-service

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      AUTH_SERVICE_PORT: 5001
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/menu_assist_auth_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_ISSUER: http://auth-service:5001
      JWT_AUDIENCE: menu-assist-api
      JWT_KID: menu-assist-rs256
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
      AUTH_INTERNAL_API_KEY: dev-internal-auth-key
      OIDC_REDIRECT_URI: http://localhost:5000/v1/auth/oauth/callback
      OIDC_SCOPES: openid profile email
      # Set OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY via env file or host env before compose up
    ports:
      - '5001:5001'
    depends_on:
      - postgres
      - rabbitmq

  application-service:
    build:
      context: .
      dockerfile: apps/application-service/Dockerfile
    environment:
      APPLICATION_SERVICE_PORT: 5002
      APPLICATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/menu_assist_application_service
      ADMIN_SERVICE_URL: http://admin-service:5003
      ADMIN_INTERNAL_API_KEY: dev-internal-onboarding-key
      APPLICATION_INTERNAL_API_KEY: dev-internal-application-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:5001
      AUTH_INTERNAL_API_KEY: dev-internal-auth-key
      AUTH_JWKS_URI: http://auth-service:5001/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:5001
      AUTH_JWT_AUDIENCE: menu-assist-api
      REVENUECAT_WEBHOOK_SECRET: dev-revenuecat-webhook-secret
      REVENUECAT_ENTITLEMENT_ID: premium
      REVENUECAT_MANAGEMENT_URL: ${REVENUECAT_MANAGEMENT_URL:-}
      MEMBERSHIP_PRICE_LABEL: ${MEMBERSHIP_PRICE_LABEL:-$$2.99}
      MEMBERSHIP_BILLING_PERIOD_LABEL: ${MEMBERSHIP_BILLING_PERIOD_LABEL:-Per Month}
      REFERRAL_SHARE_BASE_URL: ${REFERRAL_SHARE_BASE_URL:-https://menu-assist.anikstudio.com}
    ports:
      - '5002:5002'
    depends_on:
      - postgres
      - rabbitmq
      - admin-service

  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      ADMIN_SERVICE_PORT: 5003
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/menu_assist_admin_service
      ADMIN_INTERNAL_API_KEY: dev-internal-onboarding-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_JWKS_URI: http://auth-service:5001/.well-known/jwks.json
      AUTH_JWT_ISSUER: http://auth-service:5001
      AUTH_JWT_AUDIENCE: menu-assist-api
      # REVENUECAT_API_KEY: ${REVENUECAT_API_KEY:-}
      REVENUECAT_API_KEY: sk_WbsizPERhiMCzApDaYLdBXueCbgnq
      REVENUECAT_PROJECT_ID: projcee2821c
      REVENUECAT_API_BASE_URL: ${REVENUECAT_API_BASE_URL:-https://api.revenuecat.com/v2}
    ports:
      - '5003:5003'
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data:
