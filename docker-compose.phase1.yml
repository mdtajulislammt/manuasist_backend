version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'

  ai-ingestion-service:
    build:
      context: .
      dockerfile: apps/ai-ingestion-service/Dockerfile
    environment:
      AI_INGESTION_SERVICE_PORT: 3004
      AI_INGESTION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_ingestion_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3004:3004'
    depends_on:
      - rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      AUTH_SERVICE_PORT: 3001
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3001:3001'
    depends_on:
      - rabbitmq

  application-service:
    build:
      context: .
      dockerfile: apps/application-service/Dockerfile
    environment:
      APPLICATION_SERVICE_PORT: 3002
      APPLICATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/application_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3002:3002'
    depends_on:
      - postgres
      - rabbitmq

  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      ADMIN_SERVICE_PORT: 3003
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/admin_service_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3003:3003'
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
